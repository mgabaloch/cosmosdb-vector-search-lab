name: .NET Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore CosmosdbVectorSearchLab/CosmosdbVectorSearchLab.csproj

    - name: Build
      run: dotnet build CosmosdbVectorSearchLab/CosmosdbVectorSearchLab.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test CosmosdbVectorSearchLab/CosmosdbVectorSearchLab.csproj --no-build --verbosity normal
